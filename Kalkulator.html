<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator i BMI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #1f1f1f;
            border: 3px solid gold;
            border-radius: 20px;
            padding: 30px;
            width: 420px;
            box-shadow: 0 0 30px rgba(255,215,0,0.3);
        }

        h1, h2 {
            color: gold;
            text-align: center;
        }

        hr {
            border: 1px solid gold;
            margin: 20px 0;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 10px;
            border: 1px solid gold;
            background: black;
            color: gold;
        }

        .btn {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border-radius: 25px;
            border: 2px solid gold;
            background: black;
            color: gold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: gold;
            color: black;
        }

        .result {
            margin-top: 10px;
            text-align: center;
            color: lightgreen;
        }

        a {
            color: gold;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="card">

 <a class="back" href="https://katiasztos.github.io">⬅ Powrót do strony głównej</a>

    <h1>Kalkulator</h1>

    <label>Liczba A:</label>
    <input type="number" id="a">

    <label>Liczba B:</label>
    <input type="number" id="b">

    <button class="btn" onclick="suma()">Oblicz sumę</button>
    <button class="btn" onclick="roznica()">Oblicz różnicę</button>
    <button class="btn" onclick="iloczyn()">Oblicz iloczyn</button>
    <button class="btn" onclick="iloraz()">Oblicz iloraz</button>

    <div class="result" id="wynik"></div>

    <hr>

    <h2>BMI</h2>

    <label>Masa (kg):</label>
    <input type="number" id="waga">

    <label>Wzrost (m):</label>
    <input type="number" step="0.01" id="wzrost">

    <button class="btn" onclick="bmi()">Oblicz BMI</button>

    <div class="result" id="bmiwynik"></div>

</div>

<script>
    function suma() {
        wynik.innerText = "Suma: " + (+a.value + +b.value);
    }
    function roznica() {
        wynik.innerText = "Różnica: " + (a.value - b.value);
    }
    function iloczyn() {
        wynik.innerText = "Iloczyn: " + (a.value * b.value);
    }
    function iloraz() {
        wynik.innerText = "Iloraz: " + (a.value / b.value);
    }
    function bmi() {
        let b = waga.value / (wzrost.value * wzrost.value);
        bmiwynik.innerText = "BMI: " + b.toFixed(2);
    }
</script>

</div>
</body>
</html>
